name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Gate on vulnerabilities in what actually ships (dev-only tooling is reported by Dependabot).
      - run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t antaresbot:ci .
      - run: docker compose --profile dashboard config --quiet
        env:
          BOT_TOKEN: ci-placeholder-not-a-real-token
          DISCORD_CLIENT_ID: "111111111111111111"
          DISCORD_CLIENT_SECRET: ci-placeholder
          DASHBOARD_PUBLIC_URL: https://ci.example.com
          DASHBOARD_SESSION_SECRET: ci-placeholder
          MONGO_ROOT_USER: ci
          MONGO_ROOT_PASSWORD: ci
          MONGO_APP_USER: ci
          MONGO_APP_PASSWORD: ci
